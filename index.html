    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchHandler = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return fetchHandler;
            },
            set: function(fn) {
              fetchHandler = fn;
            }
          });
        } catch (e) {}
      })();
    </script>
